
name: Build CALIX APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica CALIX
        uses: actions/checkout@v4

      - name: Configura Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configura Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepara progetto
        run: |
          mkdir www
          cp index.html styles.css app.js backup.js library-data.js manifest.webmanifest icon.svg sw.js www/
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.calix.app",
            "appName": "CALIX",
            "webDir": "www"
          }
          EOF

      - name: Crea progetto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Compila APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: CALIX-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
